name: Test live scoring parser
on:
  push:
    branches: [fix-live-actual-scores]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -v
      - run: python -m py_compile guillotine_odds.py build_snapshot.py
